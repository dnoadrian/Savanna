# Hält einen 24/7-Spielserver im Gratis-Tarif (z. B. Render) wach: ruft alle 10 Minuten
# /api/health auf. Die Adresse kommt aus package.json → "showdown": { "server": "https://…" }
# oder aus der Repository-Variable SHOWDOWN_SERVER_URL (Settings → Secrets and variables →
# Actions → Variables). Ohne Adresse passiert nichts.
# Hinweis: GitHub pausiert zeitgesteuerte Workflows nach 60 Tagen ohne Commits im Repository.
name: Server wach halten

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Server anpingen
        env:
          SERVER_VAR: ${{ vars.SHOWDOWN_SERVER_URL }}
        run: |
          URL="${SERVER_VAR:-$(node -e "try{const p=require('./package.json');process.stdout.write((p.showdown&&p.showdown.server)||'')}catch{}")}"
          if [ -z "$URL" ]; then echo "Kein Server eingetragen – nichts zu tun."; exit 0; fi
          URL="${URL%/}/api/health"
          echo "Pinge $URL"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "$URL"; then echo; echo "Server ist wach."; exit 0; fi
            echo "noch nicht erreichbar, neuer Versuch in 20 s …"; sleep 20
          done
          echo "::warning::Server hat nicht geantwortet: $URL"
